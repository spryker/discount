                                      grossAmount: [{ Type: { type: integer } }, { GreaterThanOrEqual: { value: 0 } }]
    collectorStrategyType:
        - Optional: { constraints: [{ Type: { type: string } }, { Length: { max: 255 } }] }
    collector:
        - Optional:
              {
                  constraints:
                      [
                          {
                              Collection:
                                  {
                                      allowExtraFields: false,
                                      allowMissingFields: true,
                                      fields:
                                          {
                                              condition: [{ Choice: { choices: ['and', 'or'] } }],
                                              rules: [{ Type: { type: array } }],
                                              groups: [{ Type: { type: array } }],
                                          },
                                  },
                          },
                      ],
              }
    decisionRule:
        - Optional:
              {
                  constraints:
                      [
                          {
                              Collection:
                                  {
                                      allowExtraFields: false,
                                      allowMissingFields: true,
                                      fields:
                                          {
                                              condition: [{ Choice: { choices: ['and', 'or'] } }],
                                              rules: [{ Type: { type: array } }],
                                              groups: [{ Type: { type: array } }],
                                          },
                                  },
                          },
                      ],
              }
    minimumItemQuantity:
        - Optional: { constraints: [{ GreaterThanOrEqual: { value: 1 } }] }
