        - Optional: { constraints: [{ Type: { type: bool } }] }
    isExclusive:
        - Optional: { constraints: [{ Type: { type: bool } }] }
    validFrom:
        - Optional:
              { constraints: [{ DateTime: { format: 'Y-m-d H:i:s' } }, { LessThan: { value: '2038-01-19 03:14:07' } }] }
